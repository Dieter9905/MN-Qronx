name: Đánh thức backend (thủ công)

# Bối cảnh: Render gói free cho web service "ngủ" sau 15 phút không có request,
# lần truy cập kế tiếp phải chờ khởi động ~30–60 giây.
#
# Bản trước đặt lịch `*/5 * * * *`. Với repo PRIVATE, GitHub Free chỉ cho 2.000
# phút Actions/tháng và mỗi lần chạy scheduled bị tính tối thiểu 1 phút:
#   288 lần/ngày × 1 phút ≈ 8.600 phút/tháng ⇒ hết quota sau ~7 ngày, sau đó
#   GitHub TẮT toàn bộ Actions cho tới khi reset chu kỳ ⇒ ping dừng ⇒ máy chủ ngủ.
# Vì vậy lịch định kỳ đã bỏ; việc giữ ấm giao cho monitor ngoài miễn phí
# (xem docs/keep-awake.md). File này giữ lại để bấm tay khi cần đánh thức ngay.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (thử lại 3 lần)
        run: |
          URL="https://taskalarm-api.onrender.com/api/v1/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 100 "$URL" || echo 000)
            echo "Lần $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          # Không thoát lỗi để tránh gửi email cảnh báo mỗi lần chạy
          echo "::warning::Không ping được backend (có thể đang bảo trì hoặc hết quota)."
