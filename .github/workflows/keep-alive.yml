name: Giữ backend luôn thức

# Render gói free cho web service "ngủ" sau 15 phút không có request.
# Lần truy cập kế tiếp phải chờ máy chủ khởi động lại (~30-60 giây), khiến
# người dùng thấy đăng nhập bị treo rất lâu. Ping định kỳ để tránh việc đó.

on:
  schedule:
    # GitHub Actions dùng giờ UTC. Mỗi 5 phút.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (thử lại 3 lần)
        run: |
          URL="https://taskalarm-api.onrender.com/api/v1/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 100 "$URL" || echo 000)
            echo "Lần $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          # Không thoát lỗi để tránh gửi email cảnh báo mỗi 5 phút
          echo "::warning::Không ping được backend (có thể đang bảo trì hoặc hết quota)."
