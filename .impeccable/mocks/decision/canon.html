<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1440px; height: 900px; font-family: 'Segoe UI', system-ui, sans-serif; background: #fff; color: #111827; }
.nav { display: flex; align-items: center; gap: 30px; padding: 22px 56px; border-bottom: 1px solid #EEE; }
.logo { font-weight: 800; font-size: 22px; color: #4F46E5; }
.links { display: flex; gap: 26px; font-size: 17px; color: #6B7280; }
.btn { margin-left: auto; background: #2563EB; color: #fff; padding: 12px 26px; border-radius: 10px; font-weight: 700; font-size: 16px; }
.hero { text-align: center; padding: 78px 0 0; }
.hero h1 { font-size: 62px; font-weight: 800; line-height: 1.12; background: linear-gradient(90deg, #2563EB, #7C3AED); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 20px auto 28px; font-size: 22px; color: #6B7280; max-width: 560px; }
.ctas { display: flex; gap: 14px; justify-content: center; }
.b1 { background: #2563EB; color: #fff; border-radius: 12px; padding: 15px 32px; font-weight: 700; font-size: 20px; }
.b2 { border: 2px solid #E5E7EB; border-radius: 12px; padding: 15px 32px; font-weight: 700; font-size: 20px; color: #111827; }
.shot { margin: 52px auto 0; width: 820px; height: 236px; background: #F3F4F6; border: 1px solid #E5E7EB; border-radius: 14px 14px 0 0; border-bottom: 0; box-shadow: 0 24px 60px rgba(17,24,39,.08); }
.cards { display: flex; gap: 26px; justify-content: center; margin-top: -46px; position: relative; z-index: 2; padding-bottom: 40px; }
.card { width: 270px; background: #fff; border: 1px solid #E5E7EB; border-radius: 14px; padding: 22px; box-shadow: 0 10px 30px rgba(17,24,39,.06); }
.card i { display: block; width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #2563EB, #7C3AED); margin-bottom: 16px; }
.card b { font-size: 20px; }
.card span { display: block; height: 12px; background: #F3F4F6; border-radius: 6px; margin-top: 10px; }
.card span:last-child { width: 70%; }
</style></head>
<body>
<div class="nav"><span class="logo">MN-Qronx</span><span class="links"><span>Tính năng</span><span>Bảng giá</span><span>Tài liệu</span></span><span class="btn">Dùng thử miễn phí</span></div>
<div class="hero">
  <h1>Quản lý thời gian.<br>Làm chủ công việc.</h1>
  <p>Lên kế hoạch, nhận nhắc nhở và hoàn thành đúng hạn với cả nhóm và lớp học.</p>
  <div class="ctas"><span class="b1">Dùng thử miễn phí</span><span class="b2">Xem demo</span></div>
</div>
<div class="shot"></div>
<div class="cards">
  <div class="card"><i></i><b>Chuông báo thức</b><span></span><span></span></div>
  <div class="card"><i></i><b>Làm việc nhóm</b><span></span><span></span></div>
  <div class="card"><i></i><b>Thống kê đúng hạn</b><span></span><span></span></div>
</div>
</body></html>
