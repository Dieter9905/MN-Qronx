services:
  - type: web
    name: taskalarm-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm run seed && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mn-qronx
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.mn-qronx.id.vn
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://taskalarm-api.onrender.com/api/v1/auth/google/callback
      # AI thật (9Router) – để dùng trên production, trỏ AI_BASE_URL tới 9Router
      # deploy công khai (VD VPS/Cloudflare tunnel). Thiếu URL/key → app tự fallback
      # về parser cục bộ, không ảnh hưởng người dùng.
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: kr/claude-sonnet-4.5
