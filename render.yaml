services:
  - type: web
    name: taskalarm-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm run seed && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mn-qronx
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.mn-qronx.id.vn
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://taskalarm-api.onrender.com/api/v1/auth/google/callback
      # Email – Mailjet (xem docs/email-domain-setup.md). Hai key để trống thì app
      # không gửi thư thật mà trả mã xác nhận trong response (chỉ hợp lệ khi dev).
      - key: MAIL_TRANSPORT
        value: auto
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: EMAIL_FROM
        value: MN-Qronx <no-reply@mn-qronx.id.vn>
      # Hạn mức gửi: dashboard Mailjet ghi 10 thư/giờ, mail hỗ trợ ghi 10 thư/ngày.
      # App kiểm tra cả hai, đặt 0 để tắt một cửa sổ sau khi Mailjet gỡ giới hạn.
      - key: MAIL_HOURLY_LIMIT
        value: "10"
      - key: MAIL_DAILY_LIMIT
        value: "10"
      - key: MAIL_QUOTA_TZ
        value: Asia/Ho_Chi_Minh
      - key: SMTP_HOST
        value: in-v3.mailjet.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Resend – đường gửi dự phòng qua HTTPS khi Mailjet bị khoá ở mức tài khoản
      # (xem docs/email-domain-setup.md, mục Resend). Bỏ trống cũng không sao:
      # MAIL_TRANSPORT=auto sẽ tự bỏ qua và đi tiếp Mailjet API → SMTP.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # AI riêng (self-hosted, xem thư mục ai/). Trỏ AI_INFER_URL tới URL
      # của inference server (VD https://mn-qronx-ai.onrender.com).
      # Thiếu URL → backend báo AI_NETWORK, app tự fallback về parser cục bộ.
      - key: AI_INFER_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL_VERSION
        value: mn-qronx-parser-v1
