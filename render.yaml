services:
  - type: web
    name: taskalarm-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm run seed && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mn-qronx
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.mn-qronx.id.vn
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://taskalarm-api.onrender.com/api/v1/auth/google/callback
